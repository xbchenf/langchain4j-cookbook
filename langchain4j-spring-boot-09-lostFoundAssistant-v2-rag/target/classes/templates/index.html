<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失物招领AI智能小助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h1 {
            font-size: 1.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .user-id-section {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .user-id-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .user-id-input-group {
            display: flex;
            gap: 10px;
        }
        .user-id-input-group input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
        }
        .user-id-input-group button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .user-id-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.ai {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .message.ai .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .message-time {
            font-size: 0.75em;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }
        .message.ai .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .message.user .avatar {
            background: #ddd;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>✨ 失物招领AI智能小助手 ✨</h1>
            <div class="user-id-section">
                <label>当前用户ID: <span id="currentUserId">12311213</span></label>
                <div class="user-id-input-group">
                    <input type="text" id="userIdInput" placeholder="请输入用户ID" value="12311213">
                    <button onclick="setUserId()">设置用户ID</button>
                    <button onclick="clearHistory()">清除历史记录</button>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- 消息将在这里动态添加 -->
        </div>

        <div class="chat-input">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = '12311213';
        let isStreaming = false;

        // 页面加载时获取历史记录
        window.onload = function() {
            loadChatHistory();
        };

        // 设置用户ID
        function setUserId() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (userId) {
                currentUserId = userId;
                document.getElementById('currentUserId').textContent = userId;
                loadChatHistory();
            }
        }

        // 加载聊天历史
        async function loadChatHistory() {
            try {
                const response = await fetch(`/chat-history?userId=${currentUserId}`);
                const history = await response.json();
                
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                
                // 反转历史消息以正确显示顺序
                history.reverse().forEach(msg => {
                    addMessage(msg.content, msg.role === '0' ? 'user' : 'ai', formatTime(msg.createTime));
                });
                
                // 如果没有历史记录，显示欢迎消息
                if (history.length === 0) {
                    addMessage('您好！我是失物招领小助手，可以帮助您查询丢失物品信息或发布招领信息。如果丢失/捡到东西，请留下姓名，联系电话，丢失/捡到物品，请问有什么可以帮您？', 'ai');
                }
                
                scrollToBottom();
            } catch (error) {
                console.error('加载历史记录失败:', error);
                addMessage('加载历史记录失败，请稍后再试', 'ai');
            }
        }

        // 清除历史记录
        async function clearHistory() {
            if (confirm('确定要清除所有聊天记录吗？')) {
                try {
                    await fetch(`/chat-history?userId=${currentUserId}`, { method: 'DELETE' });
                    loadChatHistory();
                } catch (error) {
                    console.error('清除历史记录失败:', error);
                    alert('清除失败，请稍后再试');
                }
            }
        }

        // 发送消息
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message || isStreaming) return;
            
            // 显示用户消息
            addMessage(message, 'user');
            messageInput.value = '';
            
            // 禁用发送按钮
            isStreaming = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span>';
            
            try {
                // 创建AI消息占位符
                const aiMessageDiv = addMessage('', 'ai');
                const contentDiv = aiMessageDiv.querySelector('.message-content');
                
                // 流式获取AI响应
                const response = await fetch(`/chat-stream?userId=${currentUserId}&message=${encodeURIComponent(message)}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                let accumulatedText = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedText += chunk;
                    contentDiv.textContent = accumulatedText;
                    scrollToBottom();
                }
                
            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage('发送消息失败，请稍后再试', 'ai');
            } finally {
                // 恢复发送按钮
                isStreaming = false;
                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        // 添加消息到聊天窗口
        function addMessage(text, type, time = null) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = type === 'user' ? '' : '🤖';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.style.flex = '1';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            if (time) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = time;
                contentWrapper.appendChild(contentDiv);
                contentWrapper.appendChild(timeDiv);
            } else {
                contentWrapper.appendChild(contentDiv);
            }
            
            if (type === 'ai') {
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(contentWrapper);
            } else {
                messageDiv.appendChild(contentWrapper);
                messageDiv.appendChild(avatar);
            }
            
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }

        // 滚动到底部
        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 处理回车键发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 格式化时间
        function formatTime(timeString) {
            if (!timeString) return '';
            const date = new Date(timeString);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
